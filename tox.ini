[tox]
envlist = py38, py39, py310, py311, py312, py313, lint, fmt-check
skip_missing_interpreters = true
skipsdist = true

[testenv]
description = Run the tools/*.py test suite on this interpreter
deps = pytest
commands = pytest {posargs:tests/} -v

[testenv:lint]
description = Static checks on tools/*.py and tests/*.py
skip_install = true
deps = ruff
commands = ruff check tools/ tests/

[testenv:fmt-check]
# Scoped to new-since-tox files only: the pre-existing tools/*.py use a
# deliberate hand-aligned style (aligned `=`, aligned dict values) that
# `ruff format` would flatten. Not forcing that repo-wide in this change —
# new code stays ruff-formatted; existing style is left as the author wrote it.
description = Fail if tools/claude-lessons.py or tests/*.py aren't ruff-formatted
skip_install = true
deps = ruff
commands = ruff format --check tools/claude-lessons.py tests/
